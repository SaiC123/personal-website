<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pie Time</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, sans-serif;
    background: #fff4e0; color: #3b2a1a; display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px; overflow-x: hidden;
  }
  h1 { font-size: clamp(2.5rem, 8vw, 4.5rem); margin: 0; letter-spacing: -1px; }
  .sub { margin: 4px 0 0; opacity: .7; }
  .status {
    margin: 20px 0 8px; padding: 8px 18px; border-radius: 999px; background: #3b2a1a; color: #fff4e0;
    font-size: .95rem; min-height: 38px; transition: transform .15s;
  }
  .status.pop { transform: scale(1.12); }
  .cloud {
    flex: 1; width: 100%; max-width: 900px; display: flex; flex-wrap: wrap;
    align-items: center; justify-content: center; gap: 6px 26px; padding: 24px 0;
  }
  .name {
    font-weight: 800; line-height: 1.05; text-transform: capitalize; cursor: default;
    transition: font-size .6s cubic-bezier(.2, 1.4, .4, 1), color .4s;
    display: flex; flex-direction: column; align-items: center;
  }
  .name.bump { animation: bump .5s; }
  @keyframes bump { 40% { transform: scale(1.25) rotate(-3deg); } }
  .banner {
    display: none; text-align: center; font-size: clamp(1.8rem, 6vw, 3.5rem); font-weight: 900;
    margin-top: 12px; animation: drop .8s cubic-bezier(.2, 1.6, .4, 1);
  }
  @keyframes drop { from { transform: translateY(-80px) scale(.3); opacity: 0; } }
  .pie { position: fixed; top: -60px; font-size: 2.5rem; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(115vh) rotate(540deg); } }
</style>
</head>
<body>
  <h1>🥧 Pie Time 🥧</h1>
  <p class="sub">Who gets pied? The people have spoken. Live results.</p>
  <p class="sub">Votes are coming in from the Google Form. The form is in the GroupMe.</p>
  <div class="status" id="status">Polls are open…</div>
  <div class="cloud" id="cloud"></div>
  <div class="banner" id="banner"></div>

<script>
  // Final tallies for the vote stream. Total votes = sum of these.
  const PLAN = { tanish: 13, naresh: 11, soumith: 10, sai: 4, rex: 4, sarosh: 3, siddu: 3, abhi: 3 };
  const COLORS = ['#e4572e', '#17bebb', '#f3a712', '#6a4c93', '#2e86ab', '#ef476f', '#3d9970', '#ff7f11'];
  const FAST = new URLSearchParams(location.search).has('fast'); // ?fast for a quick preview

  const votes = Object.entries(PLAN).flatMap(([n, c]) => Array(c).fill(n));
  for (let i = votes.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [votes[i], votes[j]] = [votes[j], votes[i]];
  }

  const counts = {};
  const els = {};
  const cloud = document.getElementById('cloud');
  const statusEl = document.getElementById('status');
  Object.keys(PLAN).forEach((name, i) => {
    counts[name] = 0;
    const el = document.createElement('div');
    el.className = 'name';
    el.style.color = COLORS[i];
    el.innerHTML = `<span>${name}</span>`;
    cloud.appendChild(el);
    els[name] = el;
  });

  const size = v => 22 + v * 6;
  Object.keys(els).forEach(n => els[n].style.fontSize = size(0) + 'px');

  function render(name) {
    const el = els[name];
    el.style.fontSize = size(counts[name]) + 'px';
    el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
  }

  function castVote(i) {
    if (i >= votes.length) return finish();
    const name = votes[i];
    counts[name]++;
    render(name);
    statusEl.textContent = `New vote for ${name}!`;
    statusEl.classList.add('pop'); setTimeout(() => statusEl.classList.remove('pop'), 150);
    const delay = FAST ? 400 : 5000 + Math.random() * 5000;
    setTimeout(() => castVote(i + 1), delay);
  }

  function finish() {
    const winner = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
    statusEl.textContent = 'Polls closed. The results are in.';
    const banner = document.getElementById('banner');
    banner.textContent = `🥧 ${winner.toUpperCase()} GETS PIED! 🥧`;
    banner.style.display = 'block';
    for (let i = 0; i < 40; i++) {
      const p = document.createElement('div');
      p.className = 'pie'; p.textContent = '🥧';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDuration = 2 + Math.random() * 3 + 's';
      p.style.animationDelay = Math.random() * 2 + 's';
      document.body.appendChild(p);
    }
  }

  setTimeout(() => castVote(0), FAST ? 500 : 2000);
</script>
</body>
</html>
